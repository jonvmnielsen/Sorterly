<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#e9edf2"/>
<title>Sorterly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Rajdhani:wght@500;600;700&family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Oswald:wght@500;600&family=Nunito:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; overflow:hidden;}
  .hide{display:none !important;}
  /* the board steps back rather than vanishing when a panel opens */
  /* The balls carry their own z-index; without a stacking context of its own the board
     would let them paint on top of the panels. isolate keeps them inside the board. */
  #board{isolation:isolate; z-index:0;}
  #board.away{pointer-events:none;}
  #times,#settings{z-index:2;}
  /* hidden but still occupying space, so the board never shifts */
  .vhide{visibility:hidden; opacity:0; pointer-events:none; transition:opacity .2s ease;}
  #stage{overflow:hidden;}
  /* record lists fade in when you switch tab */
  .lb{animation:lbin .26s cubic-bezier(.2,.8,.25,1);}
  @keyframes lbin{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}
  /* a moving ball is driven frame by frame, never by a transition */
  .ball.flying{transition:none !important; z-index:6;}
  /* Landing squash. Uses the standalone `scale` property so it does not fight the
     inline `transform` that positions the ball. */
  @keyframes landsquash{
    0%{scale:1 1}
    16%{scale:1.18 .82}
    46%{scale:.95 1.05}
    74%{scale:1.03 .97}
    100%{scale:1 1}}
  /* a tube that has just become single-coloured */
  .tube .sweep.fast{animation-duration:.95s;}
  .tube.complete{border-color:var(--done) !important;
    box-shadow:inset 0 0 14px -4px var(--done), 0 0 12px -5px var(--done) !important;}
  .tube .sweep{position:absolute; left:-3px; right:-3px; top:0; bottom:0;
    pointer-events:none; opacity:0; filter:blur(1.5px); z-index:1;
    background:linear-gradient(0deg,
      transparent 0%, var(--done) 16%, var(--done) 80%, transparent 92%);
    animation:tubedone 1.5s linear forwards;}
  @keyframes tubedone{
    0%{opacity:0;   transform:translateY(58%)   scaleY(.8)}
    10%{opacity:0.76}
    70%{opacity:0.64}
    100%{opacity:0; transform:translateY(-240%) scaleY(1.3)}}
  /* settings panel — neutral chrome that works on every theme */
  #settings{position:absolute; inset:0; flex-direction:column; min-height:0; overflow:hidden;}
  #setList{flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:9px;}
  .theme-opt{display:block; width:100%; text-align:left; cursor:pointer; font:inherit; color:inherit;
    font-family:"Outfit",system-ui,sans-serif;
    background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.14); border-radius:13px;
    padding:12px 13px; transition:border-color .15s, background .15s;}
  .theme-opt.on{background:rgba(255,255,255,.12); border-color:currentColor;}
  .to-top{display:flex; align-items:center; gap:9px;}
  .to-name{font-family:"Outfit",system-ui,sans-serif; font-weight:600; font-size:15px; letter-spacing:0; text-transform:none;}
  .to-check{font-family:"Outfit",system-ui,sans-serif; margin-left:auto; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
    border:1px solid currentColor; border-radius:20px; padding:2px 9px; opacity:.9;}
  .to-desc{font-family:"Outfit",system-ui,sans-serif; font-size:12px; font-weight:400; opacity:.62; margin-top:3px; line-height:1.45;
    letter-spacing:0; text-transform:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .to-sw{display:flex; gap:7px; margin-top:10px;}
  .sw{display:block; width:19px; height:19px; border-radius:50%;}
  .sw-classic{background:radial-gradient(circle at 36% 30%,rgba(255,255,255,.2) 0%,transparent 58%),radial-gradient(circle at 44% 40%,transparent 52%,rgba(0,0,0,.2) 100%),var(--c); box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
  .sw-neon{background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.62) 0%,var(--hl) 13%,var(--c) 42%,var(--c) 74%,var(--sh) 100%);
    box-shadow:inset 0 0 4px rgba(255,255,255,.22), inset 0 0 0 1px rgba(255,255,255,.32);}
  .sw-aurora{background:radial-gradient(circle at 50% 46%,var(--hl) 0%,var(--c) 46%,var(--sh) 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.34);}
  .sw-workshop{background:
      repeating-linear-gradient(97deg, rgba(55,28,10,.10) 0 1px, rgba(255,232,198,.05) 1px 2px, transparent 2px 6px),
      radial-gradient(circle at 44% 38%,var(--hl) 0%,var(--c) 52%,var(--sh) 100%);
    box-shadow:inset 0 0 0 1px rgba(45,22,6,.3);}
  .sw-iron{background:
      radial-gradient(circle at 50% 50%, transparent 75%, rgba(255,255,255,.30) 92%, rgba(255,255,255,.07) 100%),
      radial-gradient(circle at 35% 23%, #fff 0%, rgba(255,255,255,.78) 3%, transparent 17%),
      radial-gradient(circle at 38% 27%, var(--hl) 0%, var(--c) 33%, var(--sh) 76%, #05070a 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);}
  .rectabs{margin-bottom:8px; flex:0 0 auto;}
  .rectabs button{padding:6px 2px !important; line-height:1.15;}
  .rectabs .t1{display:block; font-size:8px; letter-spacing:.09em; text-transform:uppercase; opacity:.62;}
  .rectabs .t2{display:block; font-size:12px; font-weight:700; letter-spacing:0; text-transform:none; margin-top:1px;}
  .lbsum{display:flex; gap:14px; align-items:baseline; font-size:11.5px; opacity:.6; padding:0 2px 7px;}
  .panelhead{display:flex; align-items:center; gap:10px; flex:0 0 auto; margin-bottom:9px;}
  .panelhead h3{margin:0 !important;}
  .backbtn{flex:0 0 auto; width:30px; height:30px; border-radius:50%; cursor:pointer;
    background:transparent; border:1px solid currentColor; color:inherit; opacity:.55;
    font-size:19px; line-height:1; display:flex; align-items:center; justify-content:center;
    padding:0 2px 2px 0; transition:opacity .15s;}
  .backbtn:active{opacity:1;}
  .setsec{font-size:10px; letter-spacing:.16em; text-transform:uppercase; opacity:.55; margin:6px 2px 2px;}
  .to-note{font-size:11.5px; opacity:.5; padding:4px 2px 2px;}

/* ===== classic ===== */
body[data-theme="classic"]{ --done:var(--accent); --board-inset:12px; --ink:#1d2733; --muted:#6b7785; --accent:#2f6fed; --rim:#dde3ea; }
body[data-theme="classic"]{
    background:#e9edf2; color:var(--ink); font-family:"Nunito","Inter",system-ui,sans-serif;
    display:flex; justify-content:center; height:100dvh; overflow:hidden;
    padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));
    user-select:none; -webkit-user-select:none; overscroll-behavior:none;
  }
body[data-theme="classic"] #bg{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
    background:radial-gradient(120% 80% at 50% 0%, #f8fafc 0%, #eaeef3 55%, #dde3ea 100%);}
body[data-theme="classic"] #bg .dots{position:absolute; inset:0; opacity:.6;
    background-image:radial-gradient(rgba(29,39,51,.07) 1px, transparent 1.3px); background-size:18px 18px;}
body[data-theme="classic"] #bg .wash{position:absolute; border-radius:50%; filter:blur(52px); will-change:transform,opacity;}
body[data-theme="classic"] #bg .w1{width:86vw; height:44vh; left:-18vw; top:-12vh;
    background:radial-gradient(circle at center, rgba(47,111,237,.34), transparent 68%);
    animation:wash1_classic 9s ease-in-out infinite;}
body[data-theme="classic"] #bg .w2{width:78vw; height:40vh; right:-22vw; bottom:-8vh;
    background:radial-gradient(circle at center, rgba(255,150,90,.32), transparent 68%);
    animation:wash2_classic 11s ease-in-out infinite;}
body[data-theme="classic"] #bg .w3{width:70vw; height:36vh; left:16vw; top:34vh;
    background:radial-gradient(circle at center, rgba(120,210,180,.28), transparent 70%);
    animation:wash3_classic 13s ease-in-out infinite;}
@keyframes wash1_classic{0%,100%{transform:translate3d(0,0,0) scale(1); opacity:.6}
    50%{transform:translate3d(40vw,20vh,0) scale(1.35); opacity:1}}
@keyframes wash2_classic{0%,100%{transform:translate3d(0,0,0) scale(1.15); opacity:1}
    50%{transform:translate3d(-38vw,-22vh,0) scale(.8); opacity:.5}}
@keyframes wash3_classic{0%,100%{transform:translate3d(-8vw,4vh,0) scale(.9); opacity:.45}
    50%{transform:translate3d(30vw,-18vh,0) scale(1.3); opacity:.95}}
body[data-theme="classic"] #app{position:relative; z-index:1; width:100%; max-width:600px; height:100%; display:flex; flex-direction:column; gap:10px; min-height:0;}
body[data-theme="classic"] header{display:flex; align-items:center; justify-content:space-between; gap:10px; flex:0 0 auto;}
body[data-theme="classic"] .brand{font-family:"Nunito",sans-serif; font-weight:800; font-size:clamp(19px,5.2vw,25px); letter-spacing:-.01em; line-height:1.1; color:var(--ink);}
body[data-theme="classic"] .brand small{display:block; font-family:"Inter"; font-weight:600; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-top:4px;}
body[data-theme="classic"] .hud{display:flex; gap:6px;}
body[data-theme="classic"] .stat{background:#fff; border:1px solid var(--rim); border-radius:12px; padding:5px 11px; text-align:right; min-width:76px;
    box-shadow:0 2px 6px rgba(29,39,51,.06);}
body[data-theme="classic"] .stat .k{font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-family:"Inter"; font-weight:600;}
body[data-theme="classic"] .stat .v{font-family:"Inter",system-ui,sans-serif; font-variant-numeric:tabular-nums lining-nums; font-feature-settings:"tnum" 1,"lnum" 1; font-weight:700; font-size:17px; color:var(--ink);}
body[data-theme="classic"] .modes{display:flex; gap:4px; background:#fff; padding:4px; border-radius:14px; border:1px solid var(--rim); flex:0 0 auto;
    box-shadow:0 2px 6px rgba(29,39,51,.05);}
body[data-theme="classic"] .modes button{flex:1; cursor:pointer; border:none; background:transparent; color:var(--muted);
    font-family:"Nunito",sans-serif; font-weight:700; font-size:13.5px; padding:8px 3px; border-radius:10px;
    transition:background .15s, color .15s;}
body[data-theme="classic"] .modes button.on{background:var(--accent); color:#fff;}
body[data-theme="classic"] #stage{flex:1 1 auto; min-height:0; position:relative; display:flex; align-items:center; justify-content:center;}
body[data-theme="classic"] #board{position:relative; width:100%; background:rgba(255,255,255,.52); border:1px solid rgba(255,255,255,.75);
    border-radius:22px; touch-action:none;
    -webkit-backdrop-filter:blur(10px) saturate(1.15); backdrop-filter:blur(10px) saturate(1.15);
    box-shadow:0 12px 30px -14px rgba(29,39,51,.26), inset 0 1px 0 rgba(255,255,255,.7);}
body[data-theme="classic"] .tube{position:absolute; bottom:0; background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(226,232,240,.46)); border:1px solid rgba(255,255,255,.65);
    border-radius:14px; cursor:pointer; z-index:1; touch-action:none; box-shadow:inset 0 2px 5px rgba(29,39,51,.10);
    transition:box-shadow .08s linear, border-color .08s linear, background .08s linear;}
body[data-theme="classic"] .tube.active{border-color:var(--accent); background:linear-gradient(180deg,#eef4ff,#e1eafb);
    box-shadow:0 0 0 2px rgba(47,111,237,.35), inset 0 2px 5px rgba(29,39,51,.10);}
body[data-theme="classic"] .tube.shake{animation:shake_classic .3s ease;}
@keyframes shake_classic{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
body[data-theme="classic"] .ball{position:absolute; left:0; bottom:0; border-radius:50%; z-index:2; pointer-events:none; will-change:transform;
    background:
      radial-gradient(circle at calc(36% + var(--dx,0%)) calc(30% + var(--dy,0%)), rgba(255,255,255,.20) 0%, rgba(255,255,255,.07) 34%, transparent calc(58% + var(--hs,0%))),
      radial-gradient(circle at calc(44% + var(--dx,0%)) calc(40% + var(--dy,0%)), transparent calc(52% + var(--hs,0%)), rgba(0,0,0,.20) 100%),
      var(--c);
    box-shadow:0 2px 3px rgba(29,39,51,.22), inset 0 -3px 5px rgba(0,0,0,.10), inset 0 0 0 1px rgba(0,0,0,.08);
    transition:translate .1s cubic-bezier(.3,0,.45,1);}
body[data-theme="classic"] .ball::before,body[data-theme="classic"] .ball::after{content:none;}
body[data-theme="classic"] .ball.lifted{z-index:5; transition:none;
    box-shadow:0 10px 14px -6px rgba(29,39,51,.38), inset 0 -3px 5px rgba(0,0,0,.10), inset 0 0 0 1px rgba(0,0,0,.08);}
body[data-theme="classic"] #board.no-anim .ball{transition:none;}
body[data-theme="classic"] #times,body[data-theme="classic"] #settings{position:absolute; inset:0; display:flex; flex-direction:column; opacity:0; visibility:hidden; pointer-events:none; transform:translateX(58%) scale(.985); transition:opacity .3s ease, transform .4s cubic-bezier(.33,.06,.22,1), visibility 0s linear .4s; min-height:0;
    background:rgba(255,255,255,.88); border:1px solid rgba(255,255,255,.8); border-radius:22px; padding:16px 18px;
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    box-shadow:0 12px 30px -14px rgba(29,39,51,.25);}
body[data-theme="classic"] #times.show,body[data-theme="classic"] #settings.show{opacity:1; visibility:visible; pointer-events:auto; transform:none; transition:opacity .26s ease, transform .4s cubic-bezier(.33,.06,.22,1), visibility 0s;}
body[data-theme="classic"] #times h3,body[data-theme="classic"] #settings h3{font-family:"Inter"; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin:0 0 10px; font-weight:700; flex:0 0 auto;}
body[data-theme="classic"] .lb{flex:1 1 auto; min-height:0; overflow-y:auto;}
body[data-theme="classic"] .sec{margin-bottom:9px;}
body[data-theme="classic"] .sech{display:flex; align-items:center; gap:8px; font-family:"Nunito",sans-serif; font-weight:800; font-size:15px; color:var(--ink); padding-bottom:3px;}
body[data-theme="classic"] .sech .now{font-family:"Inter"; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:#fff;
    background:var(--accent); padding:2px 8px; border-radius:20px; font-weight:700;}
body[data-theme="classic"] .sech .bestof{margin-left:auto; font-family:"Inter"; font-size:11px; color:var(--muted); font-weight:500;}
body[data-theme="classic"] .lb .row{display:grid; grid-template-columns:18px 1fr auto auto; gap:10px; align-items:baseline; padding:6px 0;
    border-top:1px solid #edf0f4; font-size:14px;}
body[data-theme="classic"] .lb .row .rk{color:var(--muted); font-weight:800; font-size:13px;}
body[data-theme="classic"] .lb .row .nm{color:var(--muted); font-size:12.5px;}
body[data-theme="classic"] .lb .row .tm{font-family:"Inter",system-ui,sans-serif; font-variant-numeric:tabular-nums lining-nums; font-feature-settings:"tnum" 1,"lnum" 1; font-weight:700; font-size:14.5px;}
body[data-theme="classic"] .lb .row .mv{color:var(--muted); font-size:12px; min-width:44px; text-align:right;}
body[data-theme="classic"] .lb .row.gold .tm,body[data-theme="classic"] .lb .row.gold .rk{color:var(--accent);}
body[data-theme="classic"] .lb .row.fresh{background:#eef4ff; border-radius:10px; padding-left:8px; padding-right:8px;}
body[data-theme="classic"] .lb .empty{color:var(--muted); font-size:12.5px; padding:6px 0 2px;}
body[data-theme="classic"] .lbfoot{flex:0 0 auto; padding-top:10px; margin-top:8px; font-size:11.5px; color:var(--muted); border-top:1px solid #edf0f4;}
body[data-theme="classic"] .controls{display:flex; gap:8px; flex:0 0 auto;}
body[data-theme="classic"] button.ctl{flex:1; cursor:pointer; font-family:"Nunito",sans-serif; font-weight:800; font-size:14px; color:var(--ink);
    background:#fff; border:1px solid var(--rim); border-radius:14px; padding:12px 10px;
    box-shadow:0 2px 6px rgba(29,39,51,.06); transition:transform .08s;}
body[data-theme="classic"] button.ctl:active{transform:translateY(1px);}
body[data-theme="classic"] button.ctl.primary{background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 6px 14px -6px rgba(47,111,237,.6);}
body[data-theme="classic"] .overlay{position:fixed; inset:0; background:transparent; display:none; align-items:flex-start; justify-content:center;
    padding:max(8px,env(safe-area-inset-top)) 18px 0; z-index:50; pointer-events:none;}
body[data-theme="classic"] .overlay.show{display:flex;}
body[data-theme="classic"] .card{pointer-events:auto; background:rgba(255,255,255,.92); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.8); border-radius:20px; padding:16px 20px;
    text-align:center; max-width:320px; width:100%; box-shadow:0 18px 40px -12px rgba(29,39,51,.35);}
body[data-theme="classic"] .card h2{font-family:"Nunito",sans-serif; font-weight:800; font-size:22px; margin:0 0 3px; color:var(--ink);}
body[data-theme="classic"] .card p{color:var(--muted); margin:0 0 10px; font-size:12px;}
body[data-theme="classic"] .card .row2{display:flex; gap:8px; margin:0 0 10px;}
body[data-theme="classic"] .card .row2 .stat{flex:1; text-align:center;}
body[data-theme="classic"] .card .v.big{font-size:22px;}
body[data-theme="classic"] .pb{background:#eef4ff; border:1px solid rgba(47,111,237,.35); color:var(--accent); font-family:"Nunito",sans-serif;
    font-weight:800; font-size:12.5px; padding:8px; border-radius:12px; margin-bottom:9px;}
body[data-theme="classic"] .theme-opt{background:#f6f8fb; border-color:#dde3ea;}
body[data-theme="classic"] .theme-opt.on{background:#eef4ff; border-color:var(--accent); color:var(--ink);}
body[data-theme="classic"] .to-check{color:var(--accent);}
body[data-theme="classic"] .hide{display:none !important;}
/* ===== neon ===== */
body[data-theme="neon"]{ --done:var(--accent2); --board-inset:9px;
    --ink:#eaf6ff; --muted:#6e8fa8; --accent:#00e5ff; --accent2:#ff2d95;
    --panel:rgba(10,22,40,.72); --rim:rgba(0,229,255,.28);
  }
body[data-theme="neon"]{
    background:#04070f; color:var(--ink); font-family:"Rajdhani",system-ui,sans-serif;
    display:flex; justify-content:center; height:100dvh; overflow:hidden;
    padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));
    user-select:none; -webkit-user-select:none; overscroll-behavior:none;
  }
body[data-theme="neon"] #bg{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
    background:linear-gradient(180deg,#05030f 0%,#0a0a24 42%,#160a2e 62%,#2a0b35 100%);}
body[data-theme="neon"] #bg .sun{position:absolute; left:50%; top:46%; width:min(70vw,360px); aspect-ratio:1; transform:translate(-50%,-50%);
    border-radius:50%; background:linear-gradient(180deg,#ffd76f,#ff5f9e 55%,#a2228c); filter:blur(1px); opacity:.5;
    -webkit-mask-image:repeating-linear-gradient(180deg,#000 0 12px,transparent 12px 17px);
            mask-image:repeating-linear-gradient(180deg,#000 0 12px,transparent 12px 17px);}
body[data-theme="neon"] #bg .glow{position:absolute; left:50%; top:46%; width:min(90vw,520px); aspect-ratio:1; transform:translate(-50%,-50%);
    border-radius:50%; background:radial-gradient(circle,rgba(255,45,149,.35),transparent 62%); filter:blur(40px);
    animation:pulse_neon 6s ease-in-out infinite;}
@keyframes pulse_neon{0%,100%{opacity:.55; transform:translate(-50%,-50%) scale(1)}50%{opacity:.85; transform:translate(-50%,-50%) scale(1.12)}}
body[data-theme="neon"] #bg .grid{position:absolute; left:-50%; right:-50%; bottom:-10%; height:62%;
    background-image:
      repeating-linear-gradient(90deg, rgba(0,229,255,.34) 0 1px, transparent 1px 84px),
      repeating-linear-gradient(0deg,  rgba(0,229,255,.28) 0 1px, transparent 1px 64px);
    transform:perspective(320px) rotateX(70deg); transform-origin:50% 100%;
    animation:scroll_neon 2.6s linear infinite; opacity:.55;}
@keyframes scroll_neon{from{background-position:0 0,0 0}to{background-position:0 0,0 64px}}
body[data-theme="neon"] #bg .haze{position:absolute; inset:0; background:radial-gradient(120% 70% at 50% 44%, transparent 40%, rgba(4,7,15,.85) 100%);}
body[data-theme="neon"] #app{position:relative; z-index:1; width:100%; max-width:600px; height:100%; display:flex; flex-direction:column; gap:10px; min-height:0;}
body[data-theme="neon"] header{display:flex; align-items:center; justify-content:space-between; gap:10px; flex:0 0 auto;}
body[data-theme="neon"] .brand{font-family:"Orbitron",sans-serif; font-weight:700; font-size:clamp(15px,4.2vw,20px); letter-spacing:.06em;
    color:#fff; text-shadow:0 0 12px rgba(0,229,255,.7),0 0 34px rgba(255,45,149,.45); line-height:1.15;}
body[data-theme="neon"] .brand small{display:block; font-family:"Rajdhani"; font-weight:600; font-size:10px; letter-spacing:.24em;
    text-transform:uppercase; color:var(--accent); text-shadow:none; margin-top:3px;}
body[data-theme="neon"] .hud{display:flex; gap:6px;}
body[data-theme="neon"] .stat{background:var(--panel); border:1px solid var(--rim); border-radius:4px; padding:4px 10px; text-align:right; min-width:74px;

body[data-theme="aurora"]{ --done:var(--accent); --board-inset:13px;
    --ink:#f2f7fb; --muted:#93a9be; --accent:#7ef0d0; --accent2:#a78bfa;
    --glass:rgba(255,255,255,.07); --rim:rgba(255,255,255,.14);
  }
body[data-theme="aurora"]{
    background:#060a14; color:var(--ink); font-family:"Outfit",system-ui,sans-serif;
    display:flex; justify-content:center; height:100dvh; overflow:hidden;
    padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));
    user-select:none; -webkit-user-select:none; overscroll-behavior:none;
  }
body[data-theme="aurora"] #bg{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
    background:linear-gradient(180deg,#05070f 0%,#0a1020 45%,#0d1526 100%);}
body[data-theme="aurora"] #bg .stars{position:absolute; inset:0; opacity:.85;
    background-image:
      radial-gradient(1.4px 1.4px at 12% 18%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 64% 12%, #dbe9ff, transparent),
      radial-gradient(1.6px 1.6px at 34% 44%, #fff, transparent),
      radial-gradient(1.1px 1.1px at 82% 34%, #cfe3ff, transparent),
      radial-gradient(1.5px 1.5px at 23% 68%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 74% 72%, #e6f0ff, transparent),
      radial-gradient(1.3px 1.3px at 48% 86%, #fff, transparent),
      radial-gradient(1px 1px at 92% 58%, #fff, transparent);
    animation:twinkle_aurora 7s ease-in-out infinite;}
@keyframes twinkle_aurora{0%,100%{opacity:.5}50%{opacity:.95}}
body[data-theme="aurora"] #bg .rib{position:absolute; border-radius:44%; filter:blur(42px); mix-blend-mode:screen; will-change:transform,opacity;}

    background:radial-gradient(ellipse at center, rgba(66,255,196,.60), rgba(66,255,196,0) 70%);
    animation:drift1_aurora 8s ease-in-out infinite, glow1 7s ease-in-out infinite;}

    animation:drift4_aurora 9s ease-in-out infinite, glow2 13s ease-in-out infinite;}
@keyframes drift1_aurora{
    0%,100%{transform:translate3d(-6%,0,0) scaleY(1) skewX(0deg)}

/* ===== workshop ===== */
body[data-theme="workshop"]{ --done:var(--brass); --board-inset:9px;
    --ink:#f3e9d8; --muted:#a89170; --brass:#d8a84b; --brass2:#f0cd82;
    --felt:#123a2e; --rim:rgba(216,168,75,.3);
  }
body[data-theme="workshop"]{
    background:#150c07; color:var(--ink); font-family:"Inter",system-ui,sans-serif;
    display:flex; justify-content:center; height:100dvh; overflow:hidden;
    padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));
    user-select:none; -webkit-user-select:none; overscroll-behavior:none;
  }
body[data-theme="workshop"] #bg{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
    background:
      repeating-linear-gradient(94deg, rgba(0,0,0,.20) 0 2px, transparent 2px 7px),
      repeating-linear-gradient(88deg, rgba(255,214,150,.045) 0 1px, transparent 1px 13px),
      repeating-linear-gradient(91deg, rgba(0,0,0,.13) 0 5px, transparent 5px 26px),
      linear-gradient(160deg,#4a2c1b 0%,#341f13 40%,#23140c 75%,#160c07 100%);}
body[data-theme="workshop"] #bg .knot{position:absolute; width:46vw; height:26vh; border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.34), transparent 66%); filter:blur(7px);}
body[data-theme="workshop"] #bg .k1{left:-8vw; top:14vh; transform:rotate(-12deg);}
body[data-theme="workshop"] #bg .k2{right:-12vw; bottom:12vh; transform:rotate(9deg);}
body[data-theme="workshop"] #bg .lamp{position:absolute; left:50%; top:-24vh; width:150vw; height:88vh; will-change:transform,opacity;
    background:radial-gradient(ellipse at center, rgba(255,206,130,.52), rgba(255,180,90,.20) 46%, transparent 72%);
    animation:lampsway_workshop 7s ease-in-out infinite;}
@keyframes lampsway_workshop{
    0%,100%{transform:translateX(-50%) translate3d(-16vw,0,0) scale(1); opacity:.55}
    50%{transform:translateX(-50%) translate3d(18vw,6vh,0) scale(1.2); opacity:1}}
body[data-theme="workshop"] #bg .mote{position:absolute; border-radius:50%; background:rgba(255,232,190,.9);
    box-shadow:0 0 6px rgba(255,214,150,.7); filter:blur(.6px); will-change:transform,opacity;}
body[data-theme="workshop"] #bg .m1{width:7px; height:7px; left:18%; bottom:-6%;  animation:swirlA_workshop 15s linear infinite;}
body[data-theme="workshop"] #bg .m2{width:5px; height:5px; left:42%; bottom:-10%; animation:swirlB_workshop 19s linear infinite;}
body[data-theme="workshop"] #bg .m3{width:8px; height:8px; left:67%; bottom:-8%;  animation:swirlC_workshop 17s linear infinite 3s;}
body[data-theme="workshop"] #bg .m4{width:6px; height:6px; left:83%; bottom:-12%; animation:swirlB_workshop 21s linear infinite 6s;}
body[data-theme="workshop"] #bg .m5{width:7px; height:7px; left:9%;  bottom:-14%; animation:swirlA_workshop 20s linear infinite 9s;}
body[data-theme="workshop"] #bg .m6{width:5px; height:5px; left:55%; bottom:-16%; animation:swirlC_workshop 23s linear infinite 12s;}
body[data-theme="workshop"] #bg .m7{width:6px; height:6px; left:30%; bottom:-20%; animation:swirlB_workshop 18s linear infinite 15s;}
@keyframes swirlA_workshop{
    0%{transform:translate3d(0,0,0) scale(.7); opacity:0}
    8%{opacity:.9}
    18%{transform:translate3d(9vw,-18vh,0) scale(1)}
    31%{transform:translate3d(-5vw,-30vh,0) scale(.8)}
    44%{transform:translate3d(11vw,-44vh,0) scale(1.1)}
    58%{transform:translate3d(-2vw,-52vh,0) scale(.85)}
    72%{transform:translate3d(13vw,-70vh,0) scale(1)}
    86%{transform:translate3d(1vw,-86vh,0) scale(.75); opacity:.7}
    100%{transform:translate3d(8vw,-112vh,0) scale(.6); opacity:0}}
@keyframes swirlB_workshop{
    0%{transform:translate3d(0,0,0) scale(.8); opacity:0}
    10%{opacity:.75}
    22%{transform:translate3d(-11vw,-16vh,0) scale(1.05)}
    36%{transform:translate3d(3vw,-26vh,0) scale(.7)}
    48%{transform:translate3d(-14vw,-40vh,0) scale(1)}
    63%{transform:translate3d(-1vw,-49vh,0) scale(1.15)}
    78%{transform:translate3d(-12vw,-68vh,0) scale(.8)}
    92%{transform:translate3d(-3vw,-90vh,0) scale(.9); opacity:.6}
    100%{transform:translate3d(-9vw,-116vh,0) scale(.6); opacity:0}}
@keyframes swirlC_workshop{
    0%{transform:translate3d(0,0,0) scale(.6); opacity:0}
    9%{opacity:.85}
    20%{transform:translate3d(5vw,-14vh,0) scale(1)}
    30%{transform:translate3d(-7vw,-20vh,0) scale(1.2)}
    42%{transform:translate3d(6vw,-33vh,0) scale(.75)}
    55%{transform:translate3d(-9vw,-42vh,0) scale(1.05)}
    68%{transform:translate3d(4vw,-58vh,0) scale(.85)}
    83%{transform:translate3d(-6vw,-78vh,0) scale(1); opacity:.65}
    100%{transform:translate3d(2vw,-110vh,0) scale(.55); opacity:0}}

    try{ localStorage.setItem(SOUNDKEY,v); }catch(e){}
  }
  const mem={};
  function lbKey(id){ return 'sorterly_v1_'+id; }
  const THEMEKEY='sorterly_theme';
  async function hapticsLoad(){

  async function hapticsSave(on){

  }
  async function themeLoad(){

  async function themeSave(id){

  function applyTheme(id,save){

  // Records are cached in memory: persistent storage is a slow round-trip and must never
  // sit between a tab tap and the list appearing.
  const cache={};
  function lbCached(id){ return cache[id]; }
  async function lbLoad(id){
    if(cache[id]) return cache[id];
    const k=lbKey(id); let list=null;
    try{ if(window.storage){ const r=await window.storage.get(k,false); if(r&&r.value) list=JSON.parse(r.value); } }catch(e){}
    if(!list){ try{ const v=localStorage.getItem(k); if(v) list=JSON.parse(v); }catch(e){} }
    if(!list) list=mem[k]||[];
    cache[id]=list;
    return list;
  }
  function warmCache(){ REC_TABS.forEach(t=>{ lbLoad(t.key).catch(()=>{}); }); }
  async function lbSave(id,list){
    const k=lbKey(id); mem[k]=list; cache[id]=list;
    try{ if(window.storage){ await window.storage.set(k,JSON.stringify(list),false); return; } }catch(e){}
    try{ localStorage.setItem(k,JSON.stringify(list)); }catch(e){}
  }

  function fmt(ms){
    const cs=Math.floor(ms/10), s=Math.floor(cs/100), m=Math.floor(s/60);
    return m+':'+String(s%60).padStart(2,'0')+'.'+String(cs%100).padStart(2,'0');
  }
  function tick(){ timeEl.textContent=fmt(performance.now()-t0); raf=requestAnimationFrame(tick); }
  function startTimer(){ t0=performance.now(); raf=requestAnimationFrame(tick); }
  function stopTimer(){ if(raf){cancelAnimationFrame(raf); raf=null;} }

  function fixedStart(n){
    const out=[];
    for(let c=0;c<n;c++){ const col=[]; for(let p=0;p<n;p++) col.push((p-c+n*2)%n); out.push(col); }
    return out;
  }
  function randomStart(n){
    const bag=[]; for(let k=0;k<n;k++) for(let i=0;i<n;i++) bag.push(k);
    for(let i=bag.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=bag[i]; bag[i]=bag[j]; bag[j]=t; }
    const out=[]; for(let c=0;c<n;c++) out.push(bag.slice(c*n,c*n+n));
    if(out.every(col=>col.every(x=>x===col[0]))) return randomStart(n);
    return out;
  }

  function deal(){
    stopTimer(); endAnim(); endIntro(); clearWinWave(); completed=[]; board.innerHTML=''; ballEls={};
    const src=MODE.random?randomStart(N):fixedStart(N);
    cols=[]; let id=0;
    for(let c=0;c<N;c++){
      const arr=[];
      for(const ci of src[c]){ arr.push({id:id,ci:ci}); id++; }
      cols.push(arr);
    }
    for(let c=0;c<N;c++){
      const t=document.createElement('div');
      t.className='tube'; t.dataset.col=c;
      t.addEventListener('pointerdown',(e)=>{e.preventDefault(); onTube(c);});
      board.appendChild(t);
    }
    for(let c=0;c<N;c++) for(const b of cols[c]){
      const el=document.createElement('div'); el.className='ball';
      // a little per-ball variation so identical colours are not identical objects
      // four clearly different grain directions, plus jitter so no two are quite alike
      const quad=[0,45,90,135][Math.floor(Math.random()*4)];
      el.style.setProperty('--gd',(quad+(Math.random()*18-9)).toFixed(1)+'deg');
      el.style.setProperty('--dx',(Math.random()*13-6.5).toFixed(1)+'%');
      el.style.setProperty('--dy',(Math.random()*13-6.5).toFixed(1)+'%');
      el.style.setProperty('--hs',(Math.random()*14-7).toFixed(1)+'%');
      board.appendChild(el); ballEls[b.id]=el;
    }
    paintBalls();
    selected=null; moves=0; started=false; won=false; endMs=0;
    movesEl.textContent='0'; timeEl.textContent='0:00.00';
    layout(); snapPlace(); dealIntro();
  }

  function refreshDoneColors(){
    if(!cols) return;
    for(let c=0;c<N;c++){
      if(!completed[c]) continue;
      const t=board.querySelector('.tube[data-col="'+c+'"]');
      const dc=doneColor(c);
      if(t&&dc) t.style.setProperty('--done',dc);
    }
  }
  function paintBalls(){
    if(!cols) return;
    const pal=PAL();
    for(let c=0;c<N;c++) for(const b of cols[c]){
      const el=ballEls[b.id]; if(!el) continue;
      const col=pal[MODE.cols[b.ci]];
      el.style.setProperty('--c',col.c); el.style.setProperty('--hl',col.hl); el.style.setProperty('--sh',col.sh);
    }
    refreshDoneColors();
  }

  let G={};
  // Read the board's real border + the theme's inner margin, so geometry never guesses.
  function boardMetrics(){
    if(typeof getComputedStyle!=='function') return {bw:1,bt:1,ins:8};
    const cs=getComputedStyle(board);
    return {
      bw:parseFloat(cs.borderLeftWidth)||0,
      bt:parseFloat(cs.borderTopWidth)||0,
      ins:parseFloat(cs.getPropertyValue('--board-inset'))||8
    };
  }
  function computeGeom(){
    const {bw,bt,ins:insBase}=boardMetrics();
    const availW=stage.clientWidth, availH=stage.clientHeight;
    const contentW=availW-2*bw;                        // padding box: where tubes actually live
    // Wide boards are limited by width, so the spacing tightens as the board grows.
    // That buys bigger balls and taller tubes, which fills the empty space above them.
    const shrink=Math.pow(Math.min(1, 6/N), 1.45);
    const gap=Math.max(2, contentW*0.016*shrink);
    const pad=Math.max(1.4, contentW*0.007*shrink);
    const ins=Math.max(4, insBase*shrink);
    const LIFT=10;                                     // headroom above tubes, beyond one ball
    const byW=(contentW-2*ins-gap*(N-1)-N*2*pad)/N;
    const byH=(availH-2*bt-2*ins-2*pad-LIFT)/(CAP+1);
    const ball=Math.max(12, Math.min(byW, byH, 56));
    const tubeW=ball+2*pad, tubeH=CAP*ball+2*pad;
    const tubesW=N*tubeW+(N-1)*gap;
    const offX=(contentW-tubesW)/2;                    // centred: equal margin left and right
    const contentH=availH-2*bt;                        // the board always fills the stage
    G={bw,bt,ins,gap,pad,ball,tubeW,tubeH,offX,tubesW,contentW,contentH,
       boardW:availW, boardH:availH};
  }
  function layout(){
    endAnim();
    computeGeom();
    board.style.width=G.boardW+'px';                   // board spans the same width as the rows above/below
    board.style.height=G.boardH+'px';
    board.querySelectorAll('.tube').forEach((t,c)=>{
      t.style.width=G.tubeW+'px'; t.style.height=G.tubeH+'px';
      t.style.left=(G.offX+c*(G.tubeW+G.gap))+'px';
      t.style.bottom=G.ins+'px';
    });
    for(const id in ballEls){ const el=ballEls[id]; el.style.width=G.ball+'px'; el.style.height=G.ball+'px'; el._t=null; }
  }
  function place(){
    if(!cols || !G.ball) return;
    const {pad,ball,tubeW,gap,tubeH,offX,ins}=G;
    for(let c=0;c<N;c++){
      const colX=offX+c*(tubeW+gap)+pad, col=cols[c], top=col.length-1;
      for(let p=0;p<col.length;p++){
        const el=ballEls[col[p].id]; if(el._fly) continue;
        const lifted=(selected===c&&p===top);
        const y=lifted ? ins+tubeH+5 : ins+pad+p*ball;
        const t=colX+'px '+(-y)+'px';
        if(el._t!==t){ el.style.translate=t; el._t=t; }
        if(el._l!==lifted){ el.classList.toggle('lifted',lifted); el._l=lifted; }
      }
    }
  }
  // A moved ball arcs across, falls under gravity, and squashes as it lands.
  // Only the one moving ball is animated, on the GPU, so the cost is the same as before.
  let anim=null;
  function endAnim(){ if(anim) anim.finish(); }
  function animateMove(el,x0,y0,x1,y1){
    const ACROSS=120, FALL=element_fall(y0,y1), SETTLE=130;
    const t0a=performance.now(); let rq=null;
    el._fly=true; el.classList.add('flying'); el.style.transformOrigin='50% 100%';
    function finish(){
      if(rq) cancelAnimationFrame(rq);
      el.style.translate=x1+'px '+(-y1)+'px'; el.style.scale='';
      el.style.transformOrigin=''; el.classList.remove('flying');
      el._fly=false; el._t=null; anim=null;
    }
    function frame(now){
      const t=now-t0a; let x,y,sx=1,sy=1;
      if(t<ACROSS){                                   // glide across, still held high
        const p=t/ACROSS, e=1-Math.pow(1-p,3);
        x=x0+(x1-x0)*e; y=y0;
      }else if(t<ACROSS+FALL){                        // accelerate downward
        const p=(t-ACROSS)/FALL; x=x1; y=y0+(y1-y0)*(p*p);
      }else if(t<ACROSS+FALL+SETTLE){                 // squash on impact, then recover
        const p=(t-ACROSS-FALL)/SETTLE;
        const k=Math.sin(Math.PI*p)*0.13*(1-p*0.45);
        x=x1; y=y1; sx=1+k; sy=1-k;
      }else{ finish(); return; }
      el.style.translate=x+'px '+(-y)+'px';
      el.style.scale=sx.toFixed(4)+' '+sy.toFixed(4);
      rq=requestAnimationFrame(frame);
    }
    anim={finish};
    rq=requestAnimationFrame(frame);
  }
  function element_fall(y0,y1){                        // longer drops take longer, as they should
    const d=Math.max(1,Math.abs(y0-y1));
    return Math.max(90, Math.min(240, 62*Math.sqrt(d/G.ball)));
  }

  // Dealing pours the balls in instead of having them simply appear.
  // CSS transitions do the work, so even 100 balls stay on the GPU.
  let introTimers=[], introRunning=false;
  function endIntro(){
    introTimers.forEach(clearTimeout); introTimers=[];
    if(!introRunning) return;
    introRunning=false;
    for(const id in ballEls){ const el=ballEls[id]; el.style.transition=''; el.style.animation=''; el.style.transformOrigin=''; el.style.scale=''; el._t=null; }
    place();
  }
  function dealIntro(){
    if(!cols || !G.ball) return;
    endIntro();
    introRunning=true;
    const {ins,pad,ball,tubeW,gap,offX,contentH}=G;
    const DUR=420, above=contentH+ball*1.4;
    board.classList.add('no-anim');
    for(let c=0;c<N;c++){
      const colX=offX+c*(tubeW+gap)+pad;
      for(let p=0;p<cols[c].length;p++){
        const el=ballEls[cols[c][p].id];
        el.style.transition='none';
        el.style.translate=colX+'px '+(-above)+'px';
        el._t=null;
      }
    }
    void board.offsetHeight;
    board.classList.remove('no-anim');
    for(let c=0;c<N;c++){
      const colX=offX+c*(tubeW+gap)+pad;
      for(let p=0;p<cols[c].length;p++){
        const el=ballEls[cols[c][p].id];
        const delay=c*22+p*38;                          // bottom balls land first, left to right
        el.style.transition='translate '+DUR+'ms cubic-bezier(.45,0,.7,.35) '+delay+'ms';
        el.style.translate=colX+'px '+(-(ins+pad+p*ball))+'px';
        // the squash starts exactly when this ball touches down
        el.style.transformOrigin='50% 100%';
        el.style.animation='landsquash 260ms ease-out '+(delay+DUR-10)+'ms both';
        el._t=null;
      }
    }
    const total=(N-1)*22+(N-1)*38+DUR+300;
    introTimers.push(setTimeout(endIntro,total));
  }

  function snapPlace(){ board.classList.add('no-anim'); place(); void board.offsetHeight; board.classList.remove('no-anim'); }

  function onTube(c){
    if(won) return;
    if(introRunning) endIntro();
    const tubeEl=board.querySelector('.tube[data-col="'+c+'"]');
    if(selected===null){
      if(cols[c].length===0){ shake(tubeEl); buzz('blocked'); sfx('blocked'); return; }
      selected=c; markActive(); place(); buzz('lift'); sfx('lift');
    } else if(selected===c){
      selected=null; markActive(); place();
    } else {
      if(cols[c].length>=CAP){ shake(tubeEl); buzz('blocked'); sfx('blocked'); return; }
      endAnim();
      const src=selected, el=ballEls[cols[src][cols[src].length-1].id];
      const x0=G.offX+src*(G.tubeW+G.gap)+G.pad, y0=G.ins+G.tubeH+5;
      cols[c].push(cols[src].pop());
      const x1=G.offX+c*(G.tubeW+G.gap)+G.pad, y1=G.ins+G.pad+(cols[c].length-1)*G.ball;
      moves++; movesEl.textContent=moves;
      if(!started){ started=true; startTimer(); }
      selected=null; markActive(); place();
      animateMove(el,x0,y0,x1,y1);
      let run=0; for(let i=cols[c].length-1;i>=0;i--){ if(cols[c][i].ci===cols[c][cols[c].length-1].ci) run++; else break; }
      buzz('drop'); sfx('drop',run-1);
      updateComplete(c);
      checkWin();
    }
  }
  let completed=[];
  function doneColor(c){
    const col=cols[c]; if(!col||!col.length) return null;
    let hex=PAL()[MODE.cols[col[0].ci]].c;
    if(hex.length===9) hex=hex.slice(0,7);     // drop glass alpha so the sweep stays vivid
    return hex;
  }
  function isComplete(c){
    const col=cols[c];
    if(col.length!==N) return false;
    const f=col[0].ci;
    for(const b of col) if(b.ci!==f) return false;
    return true;
  }
  // Fires the moment a tube becomes single-coloured — six small wins on the way to the big one.
  function updateComplete(changed){
    for(let c=0;c<N;c++){
      const now=isComplete(c), was=!!completed[c];
      if(now===was) continue;
      completed[c]=now;
      const t=board.querySelector('.tube[data-col="'+c+'"]');
      if(!t) continue;
      t.classList.toggle('complete',now);
      if(now){
        const dc=doneColor(c); if(dc) t.style.setProperty('--done',dc);
        const frozen=dc;
        const sw=document.createElement('i');
        sw.className='sweep';
        if(frozen) sw.style.setProperty('--done',frozen);   // beam keeps its colour for the whole flight
        t.appendChild(sw);
        setTimeout(()=>{ if(sw.parentNode) sw.parentNode.removeChild(sw); },1700);
        if(c===changed){ buzz('lift'); sfx('complete',4); }
      }else{
        t.style.removeProperty('--done');
      }
    }
  }
  function markActive(){ board.querySelectorAll('.tube').forEach((t,i)=>t.classList.toggle('active',i===selected)); }
  function shake(el){ if(!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

  function checkWin(){
    const used=new Set();
    for(const col of cols){
      if(col.length===0) return;
      const f=col[0].ci;
      for(const b of col) if(b.ci!==f) return;
      if(used.has(f)) return;
      used.add(f);
    }
    if(used.size===N) win();
  }
  async function win(){
    won=true; endMs=performance.now()-t0; stopTimer();
    timeEl.textContent=fmt(endMs);
    document.getElementById('winTime').textContent=fmt(endMs);
    document.getElementById('winMoves').textContent=moves;
    if(MODE.leaderboard){
      const key=modeKey();
      const prev=await lbLoad(key);
      const prevBest=prev.length?prev[0].ms:Infinity;
      const ms=Math.round(endMs), isPB=ms<prevBest;
      const entry={id:Date.now()+'_'+Math.random().toString(36).slice(2,7), ms:ms, moves:moves, at:Date.now()};
      prev.push(entry); prev.sort((a,b)=>a.ms-b.ms);
      const top=prev.slice(0,25);
      await lbSave(key,top);
      syncRecToPlay(); await render(entry.id);
      const label=MODE.random ? MODE.title+' '+N+'×'+N : MODE.title;
      document.getElementById('winSub').textContent = isPB
        ? 'All '+N+' colors home — '+label
        : 'Your best in '+label+': '+fmt(prevBest);
      pbBadge.classList.toggle('hide',!isPB);
    }else{
      document.getElementById('winSub').textContent="Shuffle mode — time isn't saved.";
      pbBadge.classList.add('hide');
    }
    winWave();
  }

  // The win is celebrated tube by tube, left to right, each in its own colour.
  let winTimers=[];
  function clearWinWave(){ winTimers.forEach(clearTimeout); winTimers=[]; }
  function winPulse(c){
    const t=board.querySelector('.tube[data-col="'+c+'"]');
    if(!t) return;
    const sw=document.createElement('i');
    sw.className='sweep fast';
    const dc=doneColor(c); if(dc) sw.style.setProperty('--done',dc);
    t.appendChild(sw);
    winTimers.push(setTimeout(()=>{ if(sw.parentNode) sw.parentNode.removeChild(sw); },1100));
    buzz('lift');
    sfx('drop', c);
  }
  function winWave(){
    clearWinWave();
    const STEP=130;
    for(let c=0;c<N;c++) winTimers.push(setTimeout(()=>winPulse(c), c*STEP));
    winTimers.push(setTimeout(()=>{ buzz('win'); sfx('win'); }, N*STEP));
    winTimers.push(setTimeout(()=>{ overlay.classList.add('show'); }, N*STEP+650));
  }

  function dstr(ts){
    if(!ts) return '';
    const d=new Date(ts);
    return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getFullYear()).slice(2);
  }
  function rowHTML(e,i,freshId){
    return '<div class="row'+(i===0?' gold':'')+(e.id===freshId?' fresh':'')+'">'+
      '<div class="rk">'+(i+1)+'</div><div class="nm">'+dstr(e.at)+'</div>'+
      '<div class="tm">'+fmt(e.ms)+'</div><div class="mv">'+e.moves+' mv</div></div>';
  }
  const REC_TABS=[
    {key:'m6',        top:'Standard', sub:'6×6'},
    {key:'m8',        top:'Standard', sub:'8×8'},
    {key:'shuffle6',  top:'Shuffle',  sub:'6×6'},
    {key:'shuffle8',  top:'Shuffle',  sub:'8×8'},
    {key:'shuffle10', top:'Shuffle',  sub:'10×10'}
  ];
  function recTitle(){
    const t=REC_TABS.find(x=>x.key===recKeySel);
    return t ? t.top+' '+t.sub : recKeySel;
  }
  function buildRecTabs(){
    recTabsEl.innerHTML='';
    REC_TABS.forEach(t=>{
      const b=document.createElement('button');
      b.innerHTML='<span class="t1">'+t.top+'</span><span class="t2">'+t.sub+'</span>';
      b.dataset.rec=t.key;
      b.addEventListener('click',()=>{ recKeySel=t.key; render(null); });
      recTabsEl.appendChild(b);
    });
  }
  async function render(freshId){
    lbTitle.textContent='Records';
    lbEl.style.animation='none'; void lbEl.offsetHeight; lbEl.style.animation='';
    recTabsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.rec===recKeySel));
    const key=recKeySel;
    let list=lbCached(key);
    if(!list){                                   // cold key: paint the frame, fill in when it lands
      lbEl.innerHTML='';
      lbLoad(key).then(()=>{ if(recKeySel===key) render(freshId); });
      return;
    }
    if(!list.length){
      lbEl.innerHTML='<div class="empty">No times yet in '+recTitle()+'.</div>';
    }else{
      const best=list[0], fewest=list.reduce((a,b)=>b.moves<a.moves?b:a,list[0]);
      lbEl.innerHTML='<div class="lbsum"><span>'+list.length+' game'+(list.length>1?'s':'')+'</span>'+
        '<span>best '+fmt(best.ms)+'</span><span>fewest '+fewest.moves+' moves</span></div>'+
        list.slice(0,10).map((e,i)=>rowHTML(e,i,freshId)).join('');
    }
    lbFoot.textContent = recKeySel.indexOf('shuffle')===0
      ? 'Shuffle deals a new layout each game, so times vary more.'
      : 'Same starting layout every game.';
  }
  function syncRecToPlay(){ recKeySel = MODE.random ? 'shuffle'+N : MODE.id; }
  async function refreshLB(){ await render(null); }

  function renderSettings(){
    setListEl.innerHTML=THEME_ORDER.map(id=>{
      const t=THEMES[id], on=(id===themeId);
      const dots=t.palette.slice(0,6).map(c=>
        '<i class="sw sw-'+id+'" style="--c:'+c.c+';--hl:'+c.hl+';--sh:'+c.sh+'"></i>').join('');
      return '<button class="theme-opt'+(on?' on':'')+'" data-theme-id="'+id+'">'+
        '<div class="to-top"><span class="to-name">'+t.label+'</span>'+
        (on?'<span class="to-check">Active</span>':'')+'</div>'+
        '<div class="to-desc">'+t.desc+'</div>'+
        '<div class="to-sw">'+dots+'</div></button>';
    }).join('')+'<div class="to-note">More themes coming later.</div>'+
      '<div class="setsec">Feedback</div>'+

      '<button class="theme-opt'+(soundOn?' on':'')+'" id="sndToggle">'+
        '<div class="to-top"><span class="to-name">Sound</span>'+
        '<span class="to-check">'+(SOUND_SUPPORTED?(soundOn?'On':'Off'):'Unavailable')+'</span></div>'+
        '<div class="to-desc">Soft tones that rise as a tube fills with one colour.</div></button>'+
      '<button class="theme-opt" id="sndTest">'+
        '<div class="to-top"><span class="to-name">Test sound</span><span class="to-check">'+
          (actx? (actx.state==='running'?'Ready':actx.state) : 'Tap')+'</span></div>'+
        '<div class="to-desc">No sound on iPhone? Check the silent switch on the side.</div></button>'+
      '<button class="theme-opt'+(hapticsOn?' on':'')+'" id="hapToggle">'+
        '<div class="to-top"><span class="to-name">Haptics</span>'+
        '<span class="to-check">'+(HAPTIC_SUPPORTED?(hapticsOn?'On':'Off'):'Unavailable')+'</span></div>'+
        '<div class="to-desc">'+(HAPTIC_SUPPORTED
           ? 'A short buzz when a ball lifts, lands or is blocked.'
           : 'This browser has no vibration. Works in the packaged app.')+'</div></button>';
    setListEl.querySelectorAll('.theme-opt').forEach(b=>{
      if(b.dataset.themeId) b.addEventListener('click',()=>applyTheme(b.dataset.themeId,true));
    });
    const stt=document.getElementById('sndTest');
    if(stt) stt.addEventListener('click',()=>{ soundOn=true; soundSave(true); sfx('test'); renderSettings(); });
    const st2=document.getElementById('sndToggle');
    if(st2) st2.addEventListener('click',()=>{
      if(!SOUND_SUPPORTED) return;
      soundOn=!soundOn; soundSave(soundOn); if(soundOn) sfx('drop',2); renderSettings();
    });
    const ht=document.getElementById('hapToggle');
    if(ht) ht.addEventListener('click',()=>{
      if(!HAPTIC_SUPPORTED) return;
      hapticsOn=!hapticsOn; hapticsSave(hapticsOn); buzz('drop'); renderSettings();
    });
  }

  function setView(v){
    view=v;
    timesEl.classList.toggle('show',v==='times');
    setEl.classList.toggle('show',v==='settings');
    board.classList.toggle('away', v!=='play');
    sizesEl.style.display = MODE.random ? 'flex' : 'none';
    modesEl.classList.toggle('vhide', v!=='play');
    sizesEl.classList.toggle('vhide', v!=='play');
    tabBtn.textContent = (v==='times') ? 'Play' : 'Records';
    setBtn.textContent = (v==='settings') ? 'Play' : 'Settings';
    if(v==='times'){ syncRecToPlay(); refreshLB(); }
    if(v==='settings') renderSettings();
    if(v==='play' && !introRunning){ layout(); snapPlace(); }
  }
  function buildTabs(){
    modesEl.innerHTML='';
    ORDER.forEach(id=>{
      const m=MODES[id], b=document.createElement('button');
      b.textContent=m.label; b.dataset.mode=id;
      b.addEventListener('click',()=>setMode(id));
      modesEl.appendChild(b);
    });
    sizesEl.innerHTML='';
    SHUFFLE_SIZES.forEach(sz=>{
      const b=document.createElement('button');
      b.textContent=sz+'×'+sz; b.dataset.size=sz;
      b.addEventListener('click',()=>setShuffleSize(sz));
      sizesEl.appendChild(b);
    });
    sizesEl.style.display='none';
  }
  function markSizes(){
    sizesEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.size===shuffleN));
  }
  function setShuffleSize(sz){
    shuffleN=sz; MODES.shuffle.n=sz;
    markSizes();
    N=sz; CAP=N+2;
    subEl.textContent='random · '+N+' colors';
    overlay.classList.remove('show');
    deal(); setView('play');
  }
  function setMode(id){
    MODE=MODES[id];
    if(MODE.random){ MODE.n=shuffleN; }
    N=MODE.n; CAP=N+2;
    modesEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.mode===id));
    sizesEl.style.display = MODE.random ? 'flex' : 'none';
    sizesEl.classList.toggle('vhide', view!=='play');
    if(MODE.random) markSizes();
    subEl.textContent=MODE.random?('random · '+N+' colors'):(N+' colors · '+N+' tubes');
    overlay.classList.remove('show');
    deal();
    setView('play');
    refreshLB();
  }

  tabBtn.addEventListener('click',()=>setView(view==='times'?'play':'times'));
  setBtn.addEventListener('click',()=>setView(view==='settings'?'play':'settings'));
  document.getElementById('backTimes').addEventListener('click',()=>setView('play'));
  document.getElementById('backSet').addEventListener('click',()=>setView('play'));
  document.getElementById('again').addEventListener('click',()=>{ overlay.classList.remove('show'); deal(); setView('play'); });
  document.getElementById('reset').addEventListener('click',()=>{ overlay.classList.remove('show'); deal(); setView('play'); });

  let rz;
  function onResize(){ clearTimeout(rz); rz=setTimeout(()=>{ if(view==='play'){ endIntro(); layout(); snapPlace(); } },60); }
  window.addEventListener('resize',onResize);
  window.addEventListener('orientationchange',onResize);
  if(window.visualViewport) window.visualViewport.addEventListener('resize',onResize);

  buildTabs();
  buildRecTabs();
  warmCache();
  applyTheme('classic',false);
  setMode('m6');
  themeLoad().then(id=>applyTheme(id,false));
  hapticsLoad().then(v=>{ hapticsOn=v; if(view==='settings') renderSettings(); });
  soundLoad().then(v=>{ soundOn=v; if(view==='settings') renderSettings(); });
  window.addEventListener('load',()=>{ if(view==='play'){ layout(); snapPlace(); } });
})();

</script>
</body>
</html>
